name: Bug Report
description: Report an issue, crash, or rendering glitch with the modpack.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue with NAF Minecraft Modpack!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Launcher, Minecraft version, and OS (e.g. Prism Launcher, 1.21.11, Windows 11).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash Log / Output
      description: Paste crash log or link to a gist/pastebin.
      render: text
    validations:
      required: false
